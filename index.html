<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>數位校園大逃脫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a petrol "mission console" header over a light classroom paper ground; each room is one framed scene card. Single light look by design. */
:root{
  --ink:#16323a; --ink-2:#4a6670; --petrol:#0f4c4a; --petrol-2:#13605d; --petrol-3:#1d7470;
  --tang:#f28c38; --tang-ink:#a8520f; --paper:#f1f6f4; --card:#ffffff; --line:#d3e2de;
  --mint:#d9ede7; --coral:#c7432f; --coral-bg:#fbe8e4; --good:#2f8f5b; --good-bg:#e2f4ea;
  --k1:#f28c38; --k2:#3aa57a; --k3:#3b82c4; --k4:#8b6cc9; --k5:#e0a91c; --k6:#c49a1c;
  --display:"Chiron GoRound TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:14px;border:0;
  background:var(--tang);color:#2b1606;font-family:var(--display);font-weight:700;font-size:18px;box-shadow:0 3px 0 #c56a1f;transition:transform .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c56a1f}
.btn[disabled]{background:#cfdcd9;color:#6c8086;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--petrol);box-shadow:inset 0 0 0 2px var(--line)}
.btn.dark{background:var(--petrol);color:#fff;box-shadow:0 3px 0 #082d2c}
.btn.big{min-height:64px;font-size:22px;padding:0 36px;border-radius:18px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--petrol);background:var(--petrol);color:#fff}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--petrol);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--petrol)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.04em;white-space:nowrap}
.prog{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
.prog small{font-size:14px;white-space:nowrap;opacity:.9}
.bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tang);border-radius:99px;transition:width .5s}
.tbtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tbtn svg{width:20px;height:20px}

main{padding-block:24px 48px}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(15,76,74,.08)}
.muted{color:var(--ink-2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--tang-ink)}

/* home */
.home{min-height:100%;background:radial-gradient(120% 80% at 70% 0%,#1a6f6a 0%,var(--petrol) 45%,#0a3533 100%);color:#fff;display:flex;flex-direction:column}
.home .wrap{flex:1;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-block:40px}
.alarm{display:inline-flex;align-items:center;gap:10px;background:rgba(199,67,47,.25);border:1px solid rgba(255,140,120,.5);color:#ffd9d1;border-radius:999px;padding:6px 16px;font-weight:700}
.alarm b{width:10px;height:10px;border-radius:50%;background:#ff6b55;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.home h1{font-size:clamp(34px,5.4vw,58px);font-weight:900;margin:18px 0 8px}
.home h1 span{color:var(--tang)}
.lines{display:grid;gap:6px;margin:18px 0 28px;font-size:20px}
.lines p{animation:rise .6s both}
.lines p:nth-child(2){animation-delay:.5s}.lines p:nth-child(3){animation-delay:1s}
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.home .meta{margin-top:20px;font-size:15px;opacity:.8}
.scene{position:relative;aspect-ratio:1/1;max-width:100%}
.scene svg{width:100%;height:auto;display:block}
.homebtns{display:flex;gap:12px;flex-wrap:wrap}

/* register */
.form{max-width:640px;margin:0 auto;padding:28px;display:grid;gap:22px}
.field{display:grid;gap:10px}
.field label,.field .lab{font-weight:700;font-size:17px}
.field input[type=text]{min-height:54px;border-radius:14px;border:2px solid var(--line);padding:0 16px;font-size:18px;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:14px;color:var(--ink-2)}

/* map */
.maphead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.maphead h2{font-size:30px}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;position:relative}
.room{position:relative;text-align:left;border:0;padding:20px;display:grid;gap:10px;min-height:190px;align-content:start}
.room .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff}
.room .ico svg{width:30px;height:30px}
.room h3{font-size:21px}
.room .sub{font-size:14px;color:var(--ink-2)}
.room .state{position:absolute;top:18px;right:18px;font-size:13px;font-weight:700;border-radius:99px;padding:4px 12px}
.room.locked{background:#e6eeec;box-shadow:none;cursor:not-allowed}
.room.locked .ico{background:#a9bcb8!important}
.room.locked h3,.room.locked .sub{color:#7b8f94}
.room.current{box-shadow:0 0 0 3px var(--tang),0 8px 24px rgba(242,140,56,.25);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(242,140,56,.35),0 8px 24px rgba(242,140,56,.25)}}
.st-cur{background:#fde9d6;color:var(--tang-ink)} .st-done{background:var(--good-bg);color:var(--good)} .st-lock{background:#d6e1de;color:#5f7479}
.keyline{display:flex;align-items:center;gap:8px;font-weight:700}
.keyline svg{width:34px;height:34px}

/* level */
.lvtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lvtop h2{font-size:28px;flex:1;min-width:200px}
.story{padding:18px 22px;border-radius:16px;background:var(--petrol);color:#e9f6f3;font-size:18px;margin-bottom:18px;display:flex;gap:14px;align-items:center}
.story svg{flex:none;width:40px;height:40px;color:var(--tang)}
.panel{padding:24px;display:grid;gap:16px}
.step{display:flex;align-items:center;gap:12px}
.step .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--petrol);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.step.done .n{background:var(--good)}
.step h3{font-size:20px}
.fb{min-height:28px;font-weight:700;border-radius:12px;padding:10px 14px;display:none}
.fb.show{display:block}
.fb.bad{background:var(--coral-bg);color:var(--coral)}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.info{background:var(--mint);color:var(--petrol)}
.real{border:2px dashed var(--tang);border-radius:16px;padding:18px;background:#fff8f1;display:grid;gap:12px}
.real .tag{font-family:var(--display);font-weight:700;color:var(--tang-ink)}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;text-align:left}
.check i{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--ink-2);display:grid;place-items:center}
.check[aria-pressed="true"]{border-color:var(--good);background:var(--good-bg)}
.check[aria-pressed="true"] i{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"] i::after{content:"";width:10px;height:6px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.firsttip{display:flex;gap:12px;align-items:flex-start;background:#eef7ff;border-radius:14px;padding:14px 16px;color:#1d4f7a;font-weight:500}
.firsttip b{font-family:var(--display);flex:none;white-space:nowrap}
.codein{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.codein input{min-height:56px;width:150px;border-radius:14px;border:2px solid var(--line);font-size:26px;text-align:center;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-variant-numeric:tabular-nums;color:var(--ink)}
.codein input.wide{width:220px}
.done-banner{display:flex;gap:10px;align-items:center;color:var(--good);font-weight:700}

/* L1 */
.ipadsvg{width:100%;max-width:340px;margin:0 auto;display:block;user-select:none;-webkit-user-select:none}
.ipadsvg .hot{fill:transparent;cursor:pointer}
.ipadsvg .part{fill:#6d7f88;transition:fill .2s}
.ipadsvg .part.lit{fill:var(--tang)}
.ipadsvg text{font-family:var(--body);font-size:13px;font-weight:700;fill:var(--tang-ink)}
.ask{font-family:var(--display);font-size:22px;font-weight:700;color:var(--petrol)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.match .col{display:grid;gap:10px;align-content:start}
.mcard{min-height:60px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:10px 14px;font-weight:700;text-align:left}
.mcard[aria-pressed="true"]{border-color:var(--tang);background:#fff3e8}
.mcard.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}

/* L2 */
.gates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gate{border-radius:12px;padding:10px 6px;text-align:center;background:#e3ecea;font-size:14px;font-weight:700;color:#5f7479;display:grid;gap:4px;justify-items:center}
.gate svg{width:26px;height:26px}
.gate.now{background:#fde9d6;color:var(--tang-ink);box-shadow:inset 0 0 0 2px var(--tang)}
.gate.ok{background:var(--good-bg);color:var(--good)}
.stage{min-height:300px;border-radius:18px;background:linear-gradient(#1f5d59,#13403e);display:grid;place-items:center;padding:24px;color:#fff;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.door{width:200px;height:240px;border-radius:100px 100px 12px 12px;background:#7a4c2a;border:6px solid #4a2b14;position:relative;box-shadow:inset 0 0 0 10px #8b5a34}
.door::after{content:"";position:absolute;right:28px;top:50%;width:22px;height:22px;border-radius:50%;background:var(--tang);box-shadow:0 0 0 4px #ffd2a8}
.door.open{transform:perspective(600px) rotateY(-70deg);transform-origin:left;transition:transform .7s}
.lever{width:150px;height:150px;border-radius:50%;border:0;display:grid;place-items:center;background:conic-gradient(var(--tang) calc(var(--p,0)*1%),rgba(255,255,255,.18) 0);touch-action:none;-webkit-touch-callout:none}
.lever span{width:118px;height:118px;border-radius:50%;background:#13403e;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:#fff}
.track{position:relative;width:min(100%,520px);height:90px;border-radius:20px;background:rgba(255,255,255,.12);touch-action:none}
.track .slot{position:absolute;right:8px;top:8px;bottom:8px;width:90px;border-radius:14px;border:3px dashed rgba(255,255,255,.5)}
.stone{position:absolute;left:8px;top:8px;width:90px;height:74px;border-radius:14px;background:#a7b5b1;box-shadow:inset 0 -6px 0 #7d8d89;display:grid;place-items:center;color:#2c3a3d;font-weight:900;font-size:28px;touch-action:none}
.mapbox{width:100%;height:340px;border-radius:16px;overflow:hidden;background:#f6efd8;position:relative;touch-action:none}
.mapin{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.mapin svg{width:100%;height:100%;display:block}
.zoomtag{position:absolute;left:10px;top:10px;background:rgba(15,76,74,.85);color:#fff;border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none}
.zoombtns{position:absolute;right:10px;top:10px;display:flex;gap:8px}
.zoombtns button{width:48px;height:48px;border-radius:12px;border:0;background:#fff;font-size:24px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* L3 */
.ccwrap{border-radius:22px;background:linear-gradient(135deg,#5e7480,#3b4e58);padding:22px;position:relative;overflow:hidden}
.ccwrap .siren{position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(255,70,50,.55),transparent 70%);pointer-events:none;animation:siren 1.2s infinite}
.ccwrap.calm .siren{display:none}
@keyframes siren{50%{opacity:.25}}
.cc{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:420px;margin:0 auto}
.conn{grid-column:span 2;grid-row:span 2;background:rgba(20,30,36,.55);border-radius:24px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{aspect-ratio:1;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff}
.cbtn svg{width:46%;height:46%}
.cbtn.on{background:#2f80ed}
.cbtn.air.on{background:var(--tang)}
.tile{aspect-ratio:1;border-radius:20px;border:0;background:rgba(20,30,36,.55);display:grid;place-items:center;color:#fff}
.tile svg{width:46%;height:46%}
.tile.lockon{background:#fff;color:var(--coral)}
.vslider{grid-row:span 2;border-radius:20px;background:rgba(20,30,36,.55);position:relative;overflow:hidden;touch-action:none;min-height:150px}
.vslider .fill{position:absolute;left:0;right:0;bottom:0;background:#fff}
.vslider svg{position:absolute;left:50%;bottom:12px;width:28px;height:28px;transform:translateX(-50%);color:#3b4e58}
.vslider .pct{position:absolute;left:0;right:0;top:8px;text-align:center;font-weight:700;font-size:14px;color:#fff;mix-blend-mode:difference}
.media{grid-column:span 4;border-radius:20px;background:rgba(20,30,36,.55);color:#cfdbe0;padding:14px 18px;font-size:15px}
.tasks{display:grid;gap:8px}
.task{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--ink-2)}
.task i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.task.ok{color:var(--good)} .task.ok i{background:var(--good);border-color:var(--good)}
.mini{width:100%;max-width:300px;display:block;margin:0 auto}
.mini .z{fill:rgba(242,140,56,.12);stroke:var(--tang);stroke-width:2;stroke-dasharray:5 4;cursor:pointer}
.mini .z.pick{fill:rgba(47,143,91,.3);stroke:var(--good);stroke-dasharray:none}
.icons4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.icons4 button{aspect-ratio:1;border-radius:18px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink)}
.icons4 button svg{width:52%;height:52%}
.icons4 button.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}

/* L4 */
.secret{position:fixed;inset:0;z-index:60;background:rgba(10,30,30,.9);display:grid;place-items:center;padding:16px}
.docpaper{width:min(560px,100%);background:#fffdf6;border-radius:12px;padding:22px;color:#2a2a2a;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.docpaper h3{font-family:var(--body);font-size:18px;display:flex;justify-content:space-between}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cell{aspect-ratio:1;border:1.5px solid #c8c2b0;border-radius:8px;position:relative;display:grid;place-items:center}
.cell svg{width:58%;height:58%}
.cell em{position:absolute;right:6px;bottom:3px;font-style:normal;font-size:11px;color:#555;font-weight:700}
.timer{height:8px;border-radius:99px;background:#e2ddcc;margin-top:14px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--coral);transform-origin:left}

/* L5 */
.dict input{width:100%;min-height:58px;border-radius:14px;border:2px solid var(--line);padding:0 16px;font-size:20px;color:var(--ink)}
.diff{font-size:22px;letter-spacing:.1em;font-family:var(--display)}
.diff .x{color:var(--coral);text-decoration:underline wavy}
.board{width:100%;height:320px;border-radius:16px;background:#fff;border:2px solid var(--line);touch-action:none;display:block;cursor:crosshair}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sz{min-width:56px}
.sz[aria-pressed="true"]{border-color:var(--petrol);background:var(--mint);color:var(--petrol)}
.path{background:var(--mint);color:var(--petrol);font-weight:700;border-radius:12px;padding:10px 14px}

/* L6 */
textarea{width:100%;min-height:96px;border-radius:14px;border:2px solid var(--line);padding:12px 16px;font-size:18px;font-family:var(--body);color:var(--ink);resize:vertical}
.pack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kslot{border-radius:14px;background:#f5f8f7;border:2px solid var(--line);padding:10px;display:flex;align-items:center;gap:10px}
.kslot svg{width:36px;height:36px;flex:none}
.kslot b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.kslot small{display:block;font-size:13px;color:var(--ink-2)}
.kslot.off{opacity:.45}
.lockrow{display:flex;gap:8px;justify-content:center}
.lockrow label{display:grid;gap:4px;justify-items:center;font-size:13px;font-weight:700;color:var(--ink-2)}
.lockrow input{width:58px;height:66px;border-radius:12px;border:2px solid var(--line);text-align:center;font-size:30px;font-family:var(--display);font-weight:700;color:var(--ink)}
.linkcard{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--petrol);color:#fff;text-decoration:none;font-family:var(--display);font-weight:700;font-size:20px;min-height:64px}
.linkcard svg{width:28px;height:28px;flex:none}


/* L3 phase 2: settings mock + AirDrop */
.settings{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#f2f2f7;min-height:330px}
.side{background:#fff;border-right:1px solid #e3e6ea;padding:12px;display:grid;gap:4px;align-content:start}
.sttl{font-family:var(--display);font-size:22px;font-weight:700;padding:4px 8px 8px}
.srow{display:flex;align-items:center;gap:10px;min-height:48px;border:0;background:none;border-radius:10px;padding:0 10px;text-align:left;font-weight:500}
.srow em{margin-left:auto;font-style:normal;font-size:14px;color:var(--ink-2)}
.srow.sel{background:#2f80ed;color:#fff}.srow.sel em{color:#e6efff}
.sico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.sico svg{width:18px;height:18px}
.smain{padding:16px;display:grid;gap:14px;align-content:start;min-width:0}
.sempty{color:var(--ink-2);padding:40px 12px;text-align:center}
.shead{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:20px;min-height:44px}

/* ---------- sound + celebration ---------- */
let actx = null, musicTimer = null;
function ac(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); return actx; }catch(e){ return null; }
}
function tone(c, f, t0, dur, type='triangle', vol=.18){
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .03);
}
function sfx(kind){
  if(!S.sound) return;
  const c = ac(); if(!c) return; const t = c.currentTime + .01;
  if(kind === 'ok') [784, 988, 1319].forEach((f,i) => tone(c, f, t + i*.09, .24));
  else if(kind === 'bad'){ tone(c, 220, t, .18, 'square', .05); tone(c, 185, t + .13, .24, 'square', .05); }
  else if(kind === 'win') [523, 659, 784, 1047, 784, 1047, 1319].forEach((f,i) => tone(c, f, t + i*.12, i === 6 ? .6 : .28, 'triangle', .2));
  else if(kind === 'door'){
    const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'sawtooth'; lp.type = 'lowpass'; lp.frequency.value = 900;
    o.frequency.setValueAtTime(95, t); o.frequency.linearRampToValueAtTime(170, t + .45); o.frequency.linearRampToValueAtTime(75, t + .8);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .85);
    o.connect(lp).connect(g).connect(c.destination); o.start(t); o.stop(t + .9);
    [659, 880, 1175].forEach((f,i) => tone(c, f, t + .85 + i*.1, .35));
  }
}
const beep = ok => sfx(ok ? 'ok' : 'bad');
const MELODY = [523,659,784,659,698,880,784,0, 659,784,880,784,698,659,587,0, 523,587,659,698,784,880,988,1047, 988,880,784,698,659,587,523,0];
function startMusic(){
  const c = ac(); if(!c) return false;
  let i = 0;
  const step = () => { const t = c.currentTime + .02, f = MELODY[i % MELODY.length]; if(f){ tone(c, f, t, .26, 'triangle', .22); tone(c, f/2, t, .26, 'sine', .12); } i++; };
  stopMusic(); step(); musicTimer = setInterval(step, 260); return true;
}
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer = null; } }
document.addEventListener('visibilitychange', () => { if(document.hidden) stopMusic(); });
function cheer(){
  const fx = $('#fx'); if(!fx) return;
  const words = ['答對了！','太棒了！','好厲害！','完全正確！'];
  const colors = ['#f28c38','#3aa57a','#3b82c4','#8b6cc9','#e0a91c'];
  const sparks = Array.from({length:18}, (_,i) => { const a = i/18*Math.PI*2, r = 110 + (i%4)*30; return `<i class="spark" style="left:50%;top:110px;background:${colors[i%5]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px"></i>`; }).join('');
  fx.innerHTML = `<div class="toast">${svg('core')}${words[Math.floor(Math.random()*words.length)]}</div>${sparks}`;
  clearTimeout(cheer.t); cheer.t = setTimeout(() => { fx.innerHTML = ''; }, 1500);
}
function say(el, msg, type='bad'){
  if(!el) return;
  el.className = 'fb show ' + type; el.textContent = msg;
  if(type === 'bad') sfx('bad'); else if(type === 'ok'){ sfx('ok'); cheer(); }
}

/* ---------- reward ---------- */
function award(n){
  if(!S.done.includes(n)){ S.done.push(n); S.done.sort(); }
  if(n===6) S.finishedAt = S.finishedAt || new Date().toISOString();
  save(); stopMusic(); sfx('win');
  const l = L[n];
  const sparks = Array.from({length:24}, (_,i) => {
    const a = i/24*Math.PI*2, r = 160 + (i%5)*30;
    const c = ['#f28c38','#3aa57a','#3b82c4','#8b6cc9','#e0a91c'][i%5];
    return `<i class="spark" style="left:50%;top:40%;background:${c};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px"></i>`;
  }).join('');
  layer.innerHTML = `<div class="reward" role="dialog" aria-modal="true">${sparks}<div>
    ${keySvg(l.hex,'bigkey')}
    <h2>取得「${l.key}」</h2>
    ${l.digit !== null ? `<div class="digit" aria-label="金鑰數字 ${l.digit}">${l.digit}</div><p>金鑰背面刻著數字 ${l.digit}，已放進金鑰背包。</p>`
      : '<p style="margin:14px 0;font-size:20px">恭喜你！數位校園系統已成功重新啟動！<br>你已成為油廠國小數位教學特務！</p>'}
    <div style="margin-top:22px"><button class="btn big" id="go">${n===6 ? '領取特務證書' : '回到冒險地圖'}</button></div>
  </div></div>`;
  $('#go', layer).addEventListener('click', () => { layer.innerHTML=''; S.screen = n===6 ? 'cert' : 'map'; S.cur = Math.min(n+1, 6); save(); render(); });
  $('#go', layer).focus();
}

function pinchZoom(box, inner, tag){
  let s = 1, x = 0, y = 0;
  const pts = new Map(); let start = null;
  const clamp = () => { const w = box.clientWidth, h = box.clientHeight; x = Math.min(0, Math.max(w - w*s, x)); y = Math.min(0, Math.max(h - h*s, y)); };
  const apply = () => { clamp(); inner.style.transform = `translate(${x}px,${y}px) scale(${s})`; tag.textContent = `放大 ${s.toFixed(1)} 倍`; };
  const rel = e => { const r = box.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  const setScale = (ns, cx, cy) => { ns = Math.max(1, Math.min(6, ns)); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply(); };
  box.addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    pts.set(e.pointerId, rel(e)); try{box.setPointerCapture(e.pointerId)}catch(_){}
    if(pts.size === 2){ const [a,b] = [...pts.values()]; start = {d:Math.hypot(a.x-b.x,a.y-b.y)||1, s, x, y, cx:(a.x+b.x)/2, cy:(a.y+b.y)/2}; }
    else if(pts.size === 1){ const p = rel(e); start = {px:p.x, py:p.y, x, y}; }
  });
  box.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, rel(e));
    if(pts.size >= 2 && start && start.d){
      const [a,b] = [...pts.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y);
      const ns = Math.max(1, Math.min(6, start.s * d / start.d));
      const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
      x = cx - (start.cx - start.x) * ns / start.s; y = cy - (start.cy - start.y) * ns / start.s; s = ns; apply();
    } else if(pts.size === 1 && start && start.px !== undefined && s > 1){
      const p = rel(e); x = start.x + p.x - start.px; y = start.y + p.y - start.py; apply();
    }
  });
  const up = e => { pts.delete(e.pointerId); if(pts.size === 1){ const p=[...pts.values()][0]; start={px:p.x,py:p.y,x,y}; } else if(!pts.size) start=null; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  box.addEventListener('gesturestart', e => e.preventDefault());
  box.addEventListener('wheel', e => { e.preventDefault(); const p = rel(e); setScale(s * (e.deltaY < 0 ? 1.15 : 0.87), p.x, p.y); }, {passive:false});
  const zi = $('#zi'), zo = $('#zo'), rz = $('#rz');
  zi && zi.addEventListener('click', () => setScale(s*1.4, box.clientWidth*0.85, box.clientHeight*0.75));
  zo && zo.addEventListener('click', () => setScale(s/1.4, box.clientWidth/2, box.clientHeight/2));
  rz && rz.addEventListener('click', () => { s=1; x=0; y=0; apply(); });
}

  <article class="lfile"><span class="lstamp">特務限定</span><span class="ltag">特務檔案</span><h3>特務檔案：金鑰排列順序</h3>

/* ---------- Level 6 ---------- */
LV[6] = (body, st) => {
  st.c = st.c || [false,false]; st.note = st.note || '';
  const order = [3,1,5,4,2];
  body.innerHTML = `${doneBanner(6)}<div class="two">
    <div class="card panel">
      <div class="step"><span class="n">1</span><h3>到教學資料館找線索</h3></div>
      ${FRAMED ? `<button class="linkcard" id="lib">${svg('ext')}開啟教學資料館</button>
      <p class="note">資料館會打開在遊戲畫面上方。看完後，點右上角的「回到遊戲」。</p>`
      : `<a class="linkcard" href="library.html" target="_blank" rel="noopener" id="lib">${svg('ext')}開啟教學資料館</a>
      <p class="note">資料館會在 Safari 新分頁打開。看完後，點 Safari 上方的遊戲分頁回到這裡。</p>
      <button class="btn ghost" id="libin">連結打不開？在遊戲內開啟資料館</button>`}
      <div class="real"><span class="tag">在你手上的 iPad 完成</span>
        <button class="check" data-c="0" aria-pressed="${st.c[0]}"><i></i>在資料館找到「特務檔案」那一段</button>
        <button class="check" data-c="1" aria-pressed="${st.c[1]}"><i></i>截圖那一段，用觸控筆圈出排列順序並儲存</button>
      </div>
      <div class="field"><label for="note6">用語音輸入一句今天的心得（至少 6 個字）</label>
        <textarea id="note6" lang="zh-Hant-TW" placeholder="點這裡，再點鍵盤上的麥克風說話">${esc(st.note)}</textarea></div>
    </div>
    <div class="card panel">
      <div class="step"><span class="n">2</span><h3>輸入最終密碼</h3></div>
      <p class="muted">金鑰背包裡的五個數字：</p>
      <div class="pack">${[1,2,3,4,5].map(n => `<div class="kslot">${keySvg(L[n].hex)}<div><small>${L[n].key}</small><b>${L[n].digit}</b></div></div>`).join('')}</div>
      <p>依照特務檔案的順序，把數字填進密碼鎖：</p>
      <div class="lockrow">${[0,1,2,3,4].map(i=>`<label>第 ${i+1} 位<input inputmode="numeric" maxlength="1" data-i="${i}" aria-label="第 ${i+1} 位" autocomplete="off"></label>`).join('')}</div>
      <button class="btn big" id="ok6">解鎖數位校園核心</button>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div></div>`;
  const fb = $('#fb');
  if(FRAMED) $('#lib').addEventListener('click', openLibrary);
  const li = $('#libin'); li && li.addEventListener('click', openLibrary);
  $$('[data-c]', body).forEach(c => c.addEventListener('click', () => { const i=+c.dataset.c; st.c[i]=!st.c[i]; save(); c.setAttribute('aria-pressed', st.c[i]); }));
  $('#note6').addEventListener('input', e => { st.note = e.target.value; save(); });
  const ins = $$('.lockrow input', body);
  ins.forEach((inp,i) => {
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g,'').slice(-1); if(inp.value && ins[i+1]) ins[i+1].focus(); });
    inp.addEventListener('keydown', e => { if(e.key==='Backspace' && !inp.value && ins[i-1]) ins[i-1].focus(); });
  });
  $('#ok6').addEventListener('click', () => {
    const code = ins.map(x => x.value).join('');
    if(!(st.c[0] && st.c[1])) return say(fb, '先完成左邊的兩項 iPad 任務（找到特務檔案、截圖並圈出順序）再打勾。', 'info');
    if(st.note.replace(/\s/g,'').length < 6) return say(fb, '心得還不到 6 個字。點心得欄，再點鍵盤上的麥克風說一句話。', 'info');

    say(fb, '再試一次！每把金鑰的數字各用一次，順序請看資料館的特務檔案。');
  });
};

/* ---------- certificate ---------- */
function rocDate(iso){ const d = iso ? new Date(iso) : new Date(); return `中華民國 ${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`; }
async function drawCert(){
  try{ await document.fonts.ready; }catch(e){}
  const W = 1600, H = 1130, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const disp = '"Chiron GoRound TC","PingFang TC","Noto Sans TC",sans-serif', bodyF = '"Noto Sans TC","PingFang TC",sans-serif';
  x.fillStyle = '#f1f6f4'; x.fillRect(0,0,W,H);
  x.fillStyle = '#0f4c4a'; x.fillRect(0,0,W,H);
  x.fillStyle = '#ffffff'; rr(x, 40, 40, W-80, H-80, 36); x.fill();
  x.strokeStyle = '#f28c38'; x.lineWidth = 6; rr(x, 70, 70, W-140, H-140, 26); x.stroke();
  x.textAlign = 'center'; x.fillStyle = '#a8520f'; x.font = `700 34px ${bodyF}`; x.fillText('高雄市楠梓區油廠國民小學', W/2, 170);
  x.fillStyle = '#0f4c4a'; x.font = `900 88px ${disp}`; x.fillText('數位教學特務證書', W/2, 285);
  x.fillStyle = '#16323a'; x.font = `700 44px ${bodyF}`; x.fillText(`${S.grade}`, W/2, 375);
  x.font = `900 96px ${disp}`; x.fillText(/(老師|教師|主任|校長|組長)$/.test(S.name) ? S.name : `${S.name}　老師`, W/2, 490);
  x.fillStyle = '#4a6670'; x.font = `500 36px ${bodyF}`;
  x.fillText('完成《數位校園大逃脫：消失的教學金鑰》六大挑戰，', W/2, 580);
  x.fillText('成功找回六把教學金鑰，重新啟動數位校園系統。', W/2, 632);
  x.fillText('特頒此證，表彰你成為油廠國小數位教學特務！', W/2, 684);
  const cols = L.slice(1);
  cols.forEach((l,i) => {
    const cx = W/2 + (i - 2.5) * 200, cy = 790;
    x.save(); x.translate(cx - 80, cy - 70); x.scale(2.5, 2.5); drawKey(x, l.hex); x.restore();
    x.fillStyle = '#16323a'; x.font = `700 26px ${bodyF}`; x.fillText(l.key, cx, cy + 82);
  });
  x.fillStyle = '#4a6670'; x.font = `500 32px ${bodyF}`; x.fillText(rocDate(S.finishedAt), W/2, 1000);
  return c;
  function rr(g, x0, y0, w, h, r){ g.beginPath(); g.moveTo(x0+r,y0); g.arcTo(x0+w,y0,x0+w,y0+h,r); g.arcTo(x0+w,y0+h,x0,y0+h,r); g.arcTo(x0,y0+h,x0,y0,r); g.arcTo(x0,y0,x0+w,y0,r); g.closePath(); }
  function drawKey(g, col){ g.fillStyle = col; g.beginPath(); g.arc(20,32,13,0,Math.PI*2); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(20,32,5.5,0,Math.PI*2); g.fill(); g.fillStyle=col; g.fillRect(31,28,28,8); g.fillRect(47,34,6,10); g.fillRect(39,34,5,7); }
}
function renderCert(){
  document.body.style.background = '';
  app.innerHTML = header() + `<main><div class="wrap"><div class="card certbox">
    <p class="eyebrow">任務完成</p><h2 style="font-size:32px">恭喜你！數位校園系統已成功重新啟動！</h2>
    <p class="muted">你已成為油廠國小數位教學特務！</p>
    <img id="certimg" alt="油廠國小數位教學特務證書" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <div class="codein" style="justify-content:center"><button class="btn big" id="dl">下載證書 PNG</button><button class="btn ghost big" id="tomap">回到地圖</button></div>
    <p class="note">若按下載沒有反應，請長按上方的證書圖片，選擇儲存到照片。</p>
    <div class="fb" id="fb" aria-live="polite"></div>
  </div></div></main>`;
  bindHeader();
  $('#tomap').addEventListener('click', () => { S.screen='map'; save(); render(); });
  const ready = drawCert().then(c => { $('#certimg').src = c.toDataURL('image/png'); return c; });
  $('#dl').addEventListener('click', async () => {
    const c = await ready;
    c.toBlob(b => {
      if(!b) return say($('#fb'), '證書產生失敗，請長按圖片儲存。');
      const u = URL.createObjectURL(b), a = document.createElement('a');
      a.href = u; a.download = `數位教學特務證書_${S.name}.png`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
    }, 'image/png');
  });
}
